<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万能侧边栏</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <button id="sidebarToggle" class="icon-btn" title="收起侧边栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h1 class="logo">万能侧边栏</h1>
      </div>
      <div class="header-right">
        <button id="extractContent" class="icon-btn" title="提取网页内容">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </button>
        <button id="areaCapture" class="icon-btn" title="区域截屏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="toolbar">
      <div class="nav-buttons">
        <button id="goBack" class="icon-btn small" title="后退">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="goForward" class="icon-btn small" title="前进">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button id="refresh" class="icon-btn small" title="刷新">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
      <div class="url-bar">
        <input type="text" id="urlInput" placeholder="输入网址或搜索..." autocomplete="off">
      </div>
      <div class="zoom-controls">
        <button id="zoomOut" class="icon-btn small" title="缩小">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <span id="zoomLevel" class="zoom-level">100%</span>
        <button id="zoomIn" class="icon-btn small" title="放大">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button id="fullscreen" class="icon-btn small" title="全屏">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
    </div>

    <main class="content-area">
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span>加载中...</span>
      </div>
      <iframe id="webview" class="webview" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    </main>

    <div id="panelBackdrop" class="panel-backdrop hidden"></div>

    <div id="aiSidebar" class="ai-sidebar">
      <div class="ai-sidebar-header">
        <h3>AI 助手</h3>
        <button id="closeAiSidebar" class="icon-btn small">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="aiList" class="ai-list"></div>
      <button id="addCustomAi" class="add-ai-btn">+ 添加自定义AI</button>
    </div>

    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-header">
        <h3>设置</h3>
        <button id="closeSettings" class="icon-btn small">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <label>外观主题</label>
          <select id="themeMode">
            <option value="light">浅色模式</option>
            <option value="dark">深色模式</option>
            <option value="system">跟随系统</option>
          </select>
        </div>
        <div class="setting-item">
          <label>链接打开方式</label>
          <select id="linkOpenMode">
            <option value="inside">在侧边栏内打开</option>
            <option value="outside">在浏览器中打开</option>
          </select>
        </div>
        <div class="setting-item">
          <label>默认首页</label>
          <input type="text" id="defaultHome" placeholder="https://chat.deepseek.com">
        </div>
        <button id="saveSettings" class="btn-primary">保存设置</button>
      </div>
    </div>

    <div id="contentViewer" class="content-viewer hidden">
      <div class="content-viewer-header">
        <h3>网页内容</h3>
        <div class="content-viewer-actions">
          <button id="copyContent" class="btn-primary small">复制内容</button>
          <button id="closeContentViewer" class="icon-btn small">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div id="contentText" class="content-text"></div>
    </div>

    <div id="addAiModal" class="modal hidden">
      <div class="modal-content">
        <h3>添加自定义AI</h3>
        <div class="form-group">
          <label>名称</label>
          <input type="text" id="aiName" placeholder="例如：ChatGPT">
        </div>
        <div class="form-group">
          <label>网址</label>
          <input type="text" id="aiUrl" placeholder="https://chat.openai.com">
        </div>
        <div class="form-group">
          <label>图标 (Emoji)</label>
          <input type="text" id="aiIcon" placeholder="🤖" maxlength="2">
        </div>
        <div class="modal-actions">
          <button id="cancelAddAi" class="btn-secondary">取消</button>
          <button id="confirmAddAi" class="btn-primary">添加</button>
        </div>
      </div>
    </div>

    <button id="exitFullscreen" class="exit-fullscreen hidden" title="退出全屏 (ESC)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="4 14 10 14 10 20"></polyline>
        <polyline points="20 10 14 10 14 4"></polyline>
        <line x1="14" y1="10" x2="21" y2="3"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
